<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏝️ Ilha da Traição</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ================= TELA INICIAL ================= -->
    <section id="tela-inicio" class="tela ativa">
      <h1>🏝️ Ilha da Traição</h1>
      <p class="subtitulo">Sobrevivência • Romance • Traição</p>
      <p>Você e seus amigos estão presos em uma ilha isolada após um naufrágio.<br>
         Os mantimentos são poucos. As noites são longas.<br>
         E <strong>alguém entre vocês não é quem diz ser...</strong></p>

      <label for="nome-jogador">Seu nome (personagem principal):</label>
      <input id="nome-jogador" type="text" placeholder="Digite seu nome" maxlength="20" autocomplete="off" />

      <label>Nomes dos amigos (até 11 — deixe em branco os que não quiser):</label>
      <div id="grid-amigos" class="grid-amigos"></div>

      <button id="btn-comecar">▶️ Começar Jogo</button>
      <p id="aviso-inicio" class="aviso"></p>
    </section>

    <!-- ================= TELA DO JOGO ================= -->
    <section id="tela-jogo" class="tela">
      <header id="cabecalho">
        <div>
          <span id="info-dia">📅 Dia 1</span>
          <span id="info-clima">☀️ ensolarado</span>
          <span id="info-fase">🌅 Chegada</span>
        </div>
        <div>
          <span id="info-comida">🍖 18</span>
          <span id="info-agua">💧 18</span>
          <span id="info-abrigo">⛺ 6</span>
          <span id="info-pistas">🔍 0</span>
        </div>
      </header>

      <div id="painel-status"></div>

      <div id="log"></div>

      <!-- Painel do traidor — aparece abaixo do histórico -->
      <div id="painel-traidor" class="oculto">
        <h3>🕵️ O TRAIDOR ERA...</h3>
        <div id="traidor-info"></div>
      </div>

      <div id="acoes">
        <button id="btn-proximo-dia">▶️ Próximo Dia</button>
        <button id="btn-espiar" class="oculto">👁️ Espiar Traidor (debug)</button>
      </div>

      <div id="painel-votacao" class="oculto"></div>
    </section>

    <!-- ================= TELA FINAL ================= -->
    <section id="tela-fim" class="tela">
      <h2 id="titulo-fim"></h2>
      <p id="texto-fim"></p>
      <button id="btn-reiniciar">🔄 Jogar Novamente</button>
    </section>

  </div>
  <script src="jogo.js"></script>
</body>
</html>
